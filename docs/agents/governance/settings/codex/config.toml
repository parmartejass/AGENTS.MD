# Shared project-scoped Codex settings for this repository.
# Keep user-global auth/history/preferences in the user-owned Codex home config.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 131072

compact_prompt = """
Create a continuation summary preserving complete controlling user intent,
task state, evidence, unresolved items, and next action. Before resuming,
retrieve and apply current owner sources through the live AGENTS.md Mandatory
Foundations declaration and its resolved Orchestration.md owner.
"""

[features]
fast_mode = true
