version: 3
ssot_owner: agents-manifest.yaml
update_trigger: Governance Agent task signals or governance authority routes change
description: >-
  Deterministic Governance Agent task-signal-to-governance-authority routing manifest.
  Detection signals identify candidates, not closed capabilities.

routing_mode: union # union | first_match

fallback_authorities:
  - "docs/agents/governance/principles/principles.md"
  - "docs/agents/governance/ssot/ssot.md"
  - "docs/agents/governance/ssot/hand-offs/hand-offs.md"

semantic_queries:
  # Pre-defined queries agents can use for embedding-based search when a profile matches.
  governance_improvement:
    - "Where are governance policies and core principles defined?"
    - "How is Governance Agent authority routing configured?"
  codex_session_log_review:
    - "How should local Codex session logs be reviewed for bounded evidence?"
    - "How are session-log findings handed off to governance-learning promotion review?"
  excel_automation:
    - "Where is Excel file processing handled in this repo?"
    - "Where are workbook/sheet constants and validation rules defined?"
    - "Where is OOXML-first Excel backend selection handled?"
    - "How is Excel COM lifecycle managed in this repo?"
    - "Where is Excel graceful quit verified and PID-scoped forced termination handled?"
  gui_task:
    - "How is GUI thread safety enforced?"
    - "Where is the queue/drain pattern implemented?"
  bugfix:
    - "Where is the failing functionality implemented?"
    - "What SSOT owns this behavior?"
  io_batch:
    - "Where is high-volume file I/O handled in this repo?"
    - "What SSOT owns batching/chunking/caching for file processing?"
  pdf_task:
    - "Where is PDF merging handled in this repo?"
    - "How is merged PDF integrity validated (page count, IDs, size checks)?"
    - "Which PDF backend is selected by the current SSOT and how are backend failures handled?"
  runtime_path:
    - "Where is runtime path or backend selection owned?"
    - "How are fallback, legacy, substitute, or downgrade paths rejected or reported?"
  perf_hotspots:
    - "Where are known performance hotspots handled in this repo?"
    - "What SSOT owns caching/batching for the slow path?"
  design_system:
    - "Where are design tokens, themes, and the accessibility floor declared?"
  packaging:
    - "How is the release artifact built, versioned, and signed?"

profiles:
  excel_automation:
