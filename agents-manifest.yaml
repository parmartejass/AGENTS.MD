      keywords:
        - "excel"
        - "workbook"
        - ".xlsx"
        - ".xlsm"
        - ".xls"
        - "openpyxl"
        - "xlsxwriter"
        - "pyxlsb"
        - "python-calamine"
        - "calamine"
        - "ooxml"
        - "open xml"
        - "surgical ooxml"
        - "workbook xml"
        - "package-part"
        - "package part"
        - "xl/worksheets"
        - "pyexcelerate"
        - "polars"
        - "read_excel"
        - "to_excel"
        - "xlwings"
        - "win32com"
        - "macro"
        - "pivot refresh"
        - "external links"
        - "Excel.Application"
        - "excel com"
        - "Dispatch"
      code_patterns:
        - "Excel.Application"
        - "xlwings"
        - "win32com.client"
        - "Dispatch("
        - "openpyxl"
        - "pyxlsb"
        - "python_calamine"
        - "pyexcelerate"
        - "polars"
        - "load_workbook"
        - "read_excel"
        - "to_excel"
        - "ExcelWriter"
        - "xlsxwriter"
      file_globs:
        - "*.xlsx"
        - "*.xlsm"
        - "*.xls"
    authorities:
      - "docs/agents/playbooks/config/config.md"
      - "docs/agents/playbooks/run-outcomes/run-outcomes.md"
      - "docs/agents/playbooks/io-batch/io-batch.md"
      - "docs/agents/interfaces/excel/excel.md"
      - "docs/agents/interfaces/os-processes/os-processes.md"
